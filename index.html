<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Plan VGC matchups as flowchart gameplans, with damage calculations for Pokémon Champions." />
    <title>VGC Gameplan Planner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/palette.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path class="lg-branch" d="M16 16.2v.8M8 20.5v-.5q0-3 3-3h10q3 0 3 3v.5"/><path class="lg-ball" d="M9.5 8a6.5 6.5 0 0 1 13 0z"/><path class="lg-ball-low" d="M9.5 8a6.5 6.5 0 0 0 13 0z"/><path class="lg-band" d="M9.5 8h13"/><circle class="lg-button" cx="16" cy="8" r="2.4"/><rect class="lg-me" x="2" y="20.5" width="12" height="8.5" rx="2.5"/><rect class="lg-opp" x="18" y="20.5" width="12" height="8.5" rx="2.5"/></svg>
          <h1>Gameplans</h1><span class="chip">Reg M-C</span>
          <button class="nav-toggle" id="nav-toggle" data-act="toggle-nav" aria-controls="nav" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11"/><path d="M10.5 6.5 9 8l1.5 1.5"/></svg>
          </button></div>
        <div class="side-actions"><button class="btn primary block" data-act="new-team">New team</button></div>
        <nav class="tree-nav" id="nav" aria-label="Teams and gameplans"></nav>
        <div class="account" id="account" hidden></div>
        <div class="side-foot">
          <button class="btn sm" data-act="import">Import JSON</button>
          <button class="btn sm" data-act="export-all">Export all</button>
          <button class="btn sm" data-act="theme" id="foot-theme" hidden>Theme</button>
        </div>
      </aside>
      <section class="main" id="main"></section>
    </div>
    <div id="layer"></div>
    <noscript>This app needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
