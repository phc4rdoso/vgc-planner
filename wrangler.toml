# Cloudflare Worker: serves the built app (./dist) and the API under /api.
# Local: `npm run db:migrate:local` once, then `npm run dev:api` next to `npm run dev`.
name = "vgc-gameplan-planner"
main = "server/src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# /api/* always reaches the Worker, even though unknown paths otherwise fall back to index.html.
run_worker_first = ["/api/*"]

# APP_URL (where the app runs; OAuth redirect URIs are built from it) defaults to the address the Worker is served
# from, so the workers.dev URL or a custom domain works without changes. Local development sets it in .dev.vars,
# because there the app (Vite, :5173) and the Worker (:8787) are on different ports.

[[d1_databases]]
binding = "DB"
database_name = "vgc-gameplans"
# Placeholder for local development. Replace with the id printed by `npx wrangler d1 create vgc-gameplans`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "server/migrations"
